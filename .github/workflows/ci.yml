name: CI

# Validação do aplicativo visual para macOS com Apple Silicon. Não publica
# versões nem artefatos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Também nomeado em build.rs (FRONTEND_DIR) e Makefile.
  FRONTEND_DIR: frontend

jobs:
  macos:
    name: test (macos arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Published changelog sections and the Cargo version are intact
        shell: bash
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Changelog validation requires a full-history checkout."
            exit 1
          fi
          if [ -z "$(git tag --list 'v*')" ]; then
            echo "::error::Changelog validation requires v* release tags."
            exit 1
          fi
          make changelog-check

      # Instalada antes da estável, que continua como padrão da job.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.90.0
        with:
          toolchain: 1.90.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Set up Node for the frontend
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install locked frontend dependencies
        run: make frontend-deps

      - name: Format
        run: make fmt-check

      - name: Clippy
        run: make lint

      - name: Test
        run: make test

      - name: Check declared minimum Rust version
        run: cargo +1.90.0 check --all-targets --locked

      # Ad hoc explícito: o runner não tem certificado. Valida montagem,
      # arquitetura, Info.plist e assinatura do artefato local.
      - name: Build the app bundle
        env:
          CODESIGN_IDENTITY: "-"
        run: make bundle

      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
