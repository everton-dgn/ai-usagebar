[package]
name = "ai-usagebar"
version = "1.23.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "macOS menu bar app for tracking multi-provider AI plan usage"
readme = "README.md"
repository = "https://github.com/everton-dgn/ai-usagebar"
publish = false

[lib]
name = "ai_usagebar"
path = "src/lib.rs"

[[bin]]
name = "ai-usagebar-tray"
path = "src/bin/ai-usagebar-tray.rs"

[[test]]
name = "macos_status_items"
harness = false

[[test]]
name = "macos_webview"
harness = false

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process", "signal", "io-util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
chrono = { version = "0.4", features = ["serde", "clock"] }
fs2 = "0.4"
tempfile = "3"
directories = "6"
thiserror = "2"
base64 = "0.23"
# Electron/Chromium `safeStorage` crypto, used only to read the Claude Desktop
# app's own OAuth token out of its encrypted `config.json`. AES-128-CBC with a
# PBKDF2-HMAC-SHA1 key derived from a login-Keychain secret; the transform is
# pure, so it is unit-tested without a Keychain.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Reads Cursor's local `state.vscdb` (its own on-disk session store) to find
# the OAuth token the Cursor IDE already wrote there. "bundled" statically
# links SQLite via cc, so the app does not depend on the system SQLite.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Menu bar app host: NSStatusItem + WKWebView.
tao = "0.37"
wry = "0.57"
tray-icon = "0.25.1"
global-hotkey = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSAppearance",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGlassEffectView",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSScreen",
    "NSStatusBarButton",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "block2",
] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"

# Only the opt-in Keychain tests use it (item counting). Production writes go
# through `security(1)`, so a native Keychain write cannot creep back in
# without first re-adding this as a real dependency.
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"

[dev-dependencies]
mockito = "1"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
